<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — Roomigo</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <meta name="theme-color" content="#059669">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fbfdfc;
      color: #18181b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 1.5rem;
      padding: 2.25rem 1.75rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .icon-box {
      width: 64px;
      height: 64px;
      border-radius: 1rem;
      background: #ecfdf5;
      border: 1px solid #d1fae5;
      color: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem auto;
    }
    .icon-box svg {
      width: 32px;
      height: 32px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #18181b;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.875rem;
      color: #71717a;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #059669;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.875rem;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background-color: #047857;
    }
    .brand {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #a1a1aa;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <!-- Wifi Off Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're currently offline</h1>
    <p>Roomigo requires an internet connection to search verified accommodations and connect with Graphic Era roommates in real time.</p>
    <button class="btn" onclick="window.location.reload()">
      Check Connection &amp; Retry
    </button>
    <div class="brand">Roomigo — Graphic Era Co-Living</div>
  </div>
</body>
</html>
